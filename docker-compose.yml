services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: mcp-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: mcp_gemma
      POSTGRES_USER: mcp
      POSTGRES_PASSWORD: mcp_dev_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mcp -d mcp_gemma"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mcp-network

  ollama:
    image: ollama/ollama:latest
    container_name: mcp-ollama
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
    networks:
      - mcp-network
    command: serve

  weaviate:
    image: semitechnologies/weaviate:latest
    container_name: mcp-weaviate
    command:
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --scheme
      - http
      - --read-timeout=180s
      - --write-timeout=180s
    ports:
      - "8080:8080"
    environment:
      QUERY_DEFAULTS_LIMIT: "25"
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      PERSISTENCE_DATA_PATH: /var/lib/weaviate
      DEFAULT_VECTORIZER_MODULE: none
      ENABLE_MODULES: text2vec-transformers
      TRANSFORMERS_INFERENCE_API: http://t2v-transformers:8080
      MODULES_CLIENT_TIMEOUT: 180s
      ASYNC_INDEXING: "false"
      CLUSTER_HOSTNAME: node1
    volumes:
      - weaviate_data:/var/lib/weaviate
    networks:
      - mcp-network
    depends_on:
      - t2v-transformers

  t2v-transformers:
    image: cr.weaviate.io/semitechnologies/transformers-inference:baai-bge-base-en-v1.5
    container_name: mcp-t2v-transformers
    ports:
      - "7070:8080"
    environment:
      - ENABLE_CUDA=0
    networks:
      - mcp-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mcp-backend
    ports:
      - "80:3000"
      - "3001:3001"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - MODEL_NAME=gemma3:4b
      - API_PORT=3000
      - MCP_PORT=3001
      - WEAVIATE_URL=http://weaviate:8080
      - DATABASE_URL=postgresql://mcp:mcp_dev_password@postgres:5432/mcp_gemma
      - PGHOST=postgres
      - PGPORT=5432
      - PGDATABASE=mcp_gemma
      - PGUSER=mcp
      - PGPASSWORD=mcp_dev_password
      - WEAVIATE_ENABLE_PQ=false
      - WEAVIATE_PQ_TRAINING_LIMIT=100000
      - WEAVIATE_CONTEXT_RESULTS=12
      - WEAVIATE_CONTEXT_CHARS=12000
      - WEAVIATE_RERANK_CANDIDATE_MULTIPLIER=2
      - WEAVIATE_SEARCH_MAX_CANDIDATES=24
      - WEAVIATE_SEARCH_MODE=hybrid
      - WEAVIATE_SEARCH_SNIPPET_CHARS=1200
      - WEAVIATE_UPLOAD_CHUNK_CHARS=1800
      - WEAVIATE_UPLOAD_CHUNK_OVERLAP_CHARS=250
      - WEAVIATE_UPLOAD_MIN_CHUNK_CHARS=800
      - WEAVIATE_UPLOAD_CHUNK_DELAY_MS=20
      - WEAVIATE_UPLOAD_CHUNK_RETRIES=3
      - OLLAMA_KEEP_ALIVE=10m
      - SUGGESTED_MODELS=gemma4:e4b,gemma4:26b,gemma4:31b
      - NODE_ENV=production
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started
      weaviate:
        condition: service_started
    volumes:
      - ./backend/src:/app/backend/src
      - ./frontend/dist:/app/frontend/dist:ro
    networks:
      - mcp-network

volumes:
  postgres_data:
  ollama_data:
  weaviate_data:

networks:
  mcp-network:
    driver: bridge
