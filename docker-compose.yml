services:
  ollama:
    image: ollama/ollama:latest
    container_name: mcp-ollama
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
    networks:
      - mcp-network
    command: serve

  weaviate:
    image: semitechnologies/weaviate:latest
    container_name: mcp-weaviate
    command:
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --scheme
      - http
      - --read-timeout=180s
      - --write-timeout=180s
    ports:
      - "8080:8080"
    environment:
      QUERY_DEFAULTS_LIMIT: "25"
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      PERSISTENCE_DATA_PATH: /var/lib/weaviate
      DEFAULT_VECTORIZER_MODULE: none
      ENABLE_MODULES: text2vec-transformers
      TRANSFORMERS_INFERENCE_API: http://t2v-transformers:8080
      MODULES_CLIENT_TIMEOUT: 180s
      ASYNC_INDEXING: "true"
      CLUSTER_HOSTNAME: node1
    volumes:
      - weaviate_data:/var/lib/weaviate
    networks:
      - mcp-network
    depends_on:
      - t2v-transformers

  t2v-transformers:
    image: cr.weaviate.io/semitechnologies/transformers-inference:baai-bge-base-en-v1.5
    container_name: mcp-t2v-transformers
    ports:
      - "7070:8080"
    environment:
      - ENABLE_CUDA=0
    networks:
      - mcp-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mcp-backend
    ports:
      - "3000:3000"
      - "3001:3001"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - MODEL_NAME=gemma3:4b
      - API_PORT=3000
      - MCP_PORT=3001
      - WEAVIATE_URL=http://weaviate:8080
      - WEAVIATE_ENABLE_PQ=true
      - WEAVIATE_PQ_TRAINING_LIMIT=100000
      - WEAVIATE_CONTEXT_RESULTS=16
      - WEAVIATE_CONTEXT_CHARS=64000
      - OLLAMA_KEEP_ALIVE=10m
      - SUGGESTED_MODELS=gemma4:e4b,gemma4:26b,gemma4:31b
      - NODE_ENV=production
    depends_on:
      - ollama
      - weaviate
    volumes:
      - ./backend/src:/app/backend/src
      - ./frontend/dist:/app/frontend/dist:ro
    networks:
      - mcp-network

volumes:
  ollama_data:
  weaviate_data:

networks:
  mcp-network:
    driver: bridge
